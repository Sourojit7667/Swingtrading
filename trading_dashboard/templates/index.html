<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TradeDesk — Live Signal Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<!-- ═══ NOISE OVERLAY REMOVED ════════════════════════════ -->

<!-- ═══ HEADER ════════════════════════════════════════ -->
<header class="header">
  <div class="header-left">
    <div class="logo-mark">▲</div>
    <div class="brand">
      <span class="brand-name">TradeDesk</span>
      <span class="brand-tag">LIVE SIGNAL TRACKER</span>
    </div>
  </div>
  <div class="header-right">
    <div class="live-dot"></div>
    <span class="live-text">LIVE</span>
    <div id="adminBadge" class="admin-badge hidden">ADMIN MODE</div>
    <button id="adminBtn" class="btn-ghost" onclick="showAdminModal()">Login as Admin</button>
    <button id="logoutBtn" class="btn-ghost hidden" onclick="adminLogout()">Logout</button>
  </div>
</header>

<!-- ═══ MAIN DASHBOARD ════════════════════════════════ -->
<main class="dashboard">

  <!-- ══ METRICS ROW ══════════════════════════════════ -->
  <section class="metrics-row">

    <!-- Accuracy Card -->
    <div class="card card-accuracy">
      <div class="card-label">SIGNAL ACCURACY</div>
      <div class="accuracy-ring-wrap">
        <svg class="ring-svg" viewBox="0 0 120 120">
          <circle class="ring-bg"    cx="60" cy="60" r="50" />
          <circle class="ring-fill"  cx="60" cy="60" r="50" id="accuracyRing" />
        </svg>
        <div class="ring-inner">
          <span class="ring-value" id="accuracyValue">0%</span>
          <span class="ring-sub">accuracy</span>
        </div>
      </div>
    </div>

    <!-- Total Trades Card -->
    <div class="card card-metric">
      <div class="card-label">TOTAL TRADES</div>
      <div class="metric-big" id="totalTradesVal">0</div>
      <div class="metric-sub">signals dispatched</div>
      <button class="see-all-btn" onclick="showAllTrades()">SEE ALL →</button>
      <div class="card-deco">◈</div>
    </div>

    <!-- Target Hits Card -->
    <div class="card card-metric card-green">
      <div class="card-label">TARGET HITS</div>
      <div class="metric-big green" id="targetHitsVal">0</div>
      <div class="metric-sub">successful exits</div>
      <div class="mini-bar-wrap">
        <div class="mini-bar" id="targetBar"></div>
      </div>
      <div class="card-deco">✦</div>
    </div>

    <!-- Stop Losses Card -->
    <div class="card card-metric card-red">
      <div class="card-label">STOP LOSSES</div>
      <div class="metric-big red" id="stopLossVal">0</div>
      <div class="metric-sub">losses taken</div>
      <div class="mini-bar-wrap">
        <div class="mini-bar red-bar" id="stopBar"></div>
      </div>
      <div class="card-deco">✦</div>
    </div>

  </section>

  <!-- ══ RUNNING TRADES ════════════════════════════════ -->
  <section class="section">
    <div class="section-header">
      <div class="section-title">
        <span class="dot green-dot"></span>
        RUNNING POSITIONS
      </div>
      <button class="refresh-btn" onclick="loadRunning()">↺ REFRESH</button>
    </div>
    <div class="running-grid" id="runningGrid">
      <div class="empty-state">No active positions</div>
    </div>
  </section>

  <!-- ══ ADD TRADE (admin only) ═══════════════════════ -->
  <section class="section admin-section" id="addTradeSection" style="display:none">
    <div class="section-header">
      <div class="section-title">
        <span class="dot gold-dot"></span>
        ADD NEW TRADE
      </div>
    </div>
    <div class="add-trade-form">
      <div class="input-wrap">
        <input type="text" id="stockInput" placeholder="Enter stock symbol (e.g. RELIANCE, INFY)" class="stock-input" autocomplete="off"/>
      </div>
      <button class="btn-primary" onclick="addTrade()">+ ADD TRADE</button>
    </div>
    <div id="addMsg" class="flash-msg"></div>
  </section>

</main>

<!-- ═══ ALL TRADES MODAL ══════════════════════════════ -->
<div class="modal-overlay" id="allTradesModal" onclick="closeModal('allTradesModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">ALL TRADES</span>
      <button class="modal-close" onclick="closeModal('allTradesModal')">✕</button>
    </div>
    <div class="modal-search">
      <input type="text" id="tradeSearch" placeholder="Search stock..." class="search-input" oninput="filterTrades()"/>
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all"     onclick="setFilter('all',this)">All</button>
      <button class="filter-tab"        data-filter="running"    onclick="setFilter('running',this)">Running</button>
      <button class="filter-tab"        data-filter="target_hit" onclick="setFilter('target_hit',this)">Target Hit</button>
      <button class="filter-tab"        data-filter="stop_loss"  onclick="setFilter('stop_loss',this)">Stop Loss</button>
    </div>
    <div class="trades-table-wrap">
      <table class="trades-table">
        <thead>
          <tr>
            <th>#</th>
            <th>STOCK</th>
            <th>STATUS</th>
            <th>RETURN</th>
            <th>DATE</th>
            <th id="actionHeader" class="hidden">ACTIONS</th>
          </tr>
        </thead>
        <tbody id="tradesTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══ RETURN % MODAL ════════════════════════════════ -->
<div class="modal-overlay" id="returnModal" onclick="closeModal('returnModal')">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">ENTER RETURN %</span>
      <button class="modal-close" onclick="closeModal('returnModal')">✕</button>
    </div>
    <div class="return-form">
      <div class="return-stock-name" id="returnStockName"></div>
      <div class="input-wrap">
        <input type="number" id="returnInput" placeholder="e.g. 15.5" class="stock-input" step="0.1" min="0"/>
      </div>
      <button class="btn-primary green-btn" onclick="submitTargetHit()">CONFIRM TARGET HIT ✅</button>
    </div>
    <div id="returnMsg" class="flash-msg"></div>
  </div>
</div>

<!-- ═══ ADMIN LOGIN MODAL ════════════════════════════ -->
<div class="modal-overlay" id="adminModal" onclick="closeModal('adminModal')">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">ADMIN ACCESS</span>
      <button class="modal-close" onclick="closeModal('adminModal')">✕</button>
    </div>
    <div class="return-form">
      <div class="input-wrap">
        <input type="email" id="adminEmail" placeholder="Gmail ID" class="stock-input"/>
      </div>
      <div class="input-wrap" style="margin-top:12px">
        <input type="password" id="adminPass" placeholder="Password" class="stock-input" onkeydown="if(event.key==='Enter')adminLogin()"/>
      </div>
      <button class="btn-primary" onclick="adminLogin()" style="margin-top:16px">LOGIN →</button>
    </div>
    <div id="adminMsg" class="flash-msg"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
